<title>识字小书</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one full-screen view at a time (bookshelf, reader, game, finish, grown-ups). The whole app is a paper book, so it keeps one light look in both themes on purpose. */
:root {
  --paper: #FAF7F0;
  --desk: #EFE8DA;
  --ink: #2A2724;
  --ink-soft: #6B655E;
  --line: #DDD3C2;
  --gold: #F3D58A;
  --leaf: #8DB86A;
  --seal: #B8432F;
  --font-hanzi: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "BiauKai", serif;
  --font-ui: "Figtree", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--font-ui); overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#app { position: relative; height: 100%; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.view { position: absolute; inset: 0; }
.view[hidden], svg[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.w, .w > *, .o > * { mix-blend-mode: multiply; }

/* bookshelf */
#shelf { display: flex; flex-direction: column; overflow-y: auto; background: var(--desk); }
.shelf-in { box-sizing: border-box; width: 100%; max-width: 1100px; margin: 0 auto; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
.shelf-top { display: flex; justify-content: flex-end; }
.books { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 3vw, 32px); }
.book { border: 0; padding: 0; background: var(--paper); border-radius: 16px; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 0 var(--line), 0 10px 24px rgba(90,70,40,.12); text-align: center; position: relative; transition: transform .15s ease; }
.book:active { transform: scale(.98); }
.book:focus-visible { outline: 4px solid var(--seal); outline-offset: 3px; }
.book svg { width: 100%; aspect-ratio: 15 / 8; display: block; max-width: 100%; }
.book .t { font-family: var(--font-hanzi); font-size: clamp(34px, 4.6vw, 48px); line-height: 1.2; padding: 10px 12px 14px; }
.book .badge { position: absolute; top: 10px; right: 10px; width: 46px; height: 46px; }
.grown { width: 46px; height: 46px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; position: relative; }
.grown svg { width: 26px; height: 26px; }
.grown .ring { position: absolute; inset: 0; width: 46px; height: 46px; }
.grown .ring circle { fill: none; stroke: var(--seal); stroke-width: 3; stroke-dasharray: 138; stroke-dashoffset: 138; }
.grown.holding .ring circle { transition: stroke-dashoffset 1s linear; stroke-dashoffset: 0; }

/* reader */
#reader { background: var(--desk); user-select: none; -webkit-user-select: none; touch-action: none; perspective: 2400px; overflow: hidden; }
.page { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: var(--paper); }
/* Page turn: a copy of the page lifts from the left edge (the spine) and turns over, like a book. */
.ghost { z-index: 6; pointer-events: none; transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden; will-change: transform; box-shadow: 0 0 40px rgba(60,45,20,.18); }
.ghost::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(60,45,20,.28), rgba(60,45,20,0) 70%); opacity: 0; }
.turn-out { animation: turnOut .62s cubic-bezier(.45,.05,.3,1) forwards; }
.turn-out::after { animation: shadeIn .62s ease forwards; }
.turn-in { animation: turnIn .62s cubic-bezier(.45,.05,.3,1) forwards; }
.turn-in::after { animation: shadeOut .62s ease forwards; }
@keyframes turnOut { to { transform: rotateY(-100deg); } }
@keyframes turnIn { from { transform: rotateY(-100deg); } to { transform: rotateY(0); } }
@keyframes shadeIn { to { opacity: 1; } }
@keyframes shadeOut { from { opacity: 1; } to { opacity: 0; } }
.pic { position: relative; min-height: 0; }
.pic > svg { width: 100%; height: 100%; display: block; }
.band { position: relative; background: var(--paper); padding: clamp(12px, 2.4vh, 26px) clamp(92px, 13vw, 140px) clamp(22px, 3.6vh, 36px); display: flex; justify-content: center; align-items: center; min-height: 22vh; }
.line { font-family: var(--font-hanzi); color: var(--ink); font-size: clamp(38px, min(7vw, 9vh), 84px); line-height: 1.3; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .06em; max-width: 13em; }
.line.long { font-size: clamp(34px, min(5.6vw, 7.4vh), 70px); }
.row-break { flex-basis: 100%; height: 0; }
.u { display: inline-flex; align-items: center; white-space: nowrap; }
.ch { background: none; border: 0; padding: 0 .04em; margin: 0; cursor: pointer; border-radius: 12px; position: relative; font: inherit; color: inherit; }
.ch:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }
.ch.pop { animation: pop .45s ease; }
.ch.reading { background: radial-gradient(closest-side, rgba(243,213,138,.95), rgba(243,213,138,.55) 70%, rgba(243,213,138,0)); }
.punct { padding: 0 .02em; color: #8A8178; }
@keyframes pop { 40% { transform: scale(1.28) rotate(-3deg) } }
.rbtn { position: absolute; width: clamp(48px, 7vw, 66px); height: clamp(48px, 7vw, 66px); border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; background: rgba(250,247,240,.92); color: var(--ink); box-shadow: 0 2px 6px rgba(60,45,20,.15); z-index: 3; }
.rbtn svg { width: 54%; height: 54%; }
.rbtn:focus-visible, .arrow:focus-visible, .card:focus-visible, .big:focus-visible { outline: 3px solid var(--seal); outline-offset: 3px; }
.rbtn.home { top: max(14px, env(safe-area-inset-top, 0px)); left: 14px; }
.rbtn.speak { top: max(14px, env(safe-area-inset-top, 0px)); right: 14px; background: var(--gold); }
.rbtn.speak.on { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08) } }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); border: 0; cursor: pointer; display: grid; place-items: center; border-radius: 50%; padding: 0; }
.arrow svg { width: 60%; height: 60%; }
.arrow.prev { left: clamp(8px, 2vw, 24px); width: clamp(52px, 7vw, 68px); height: clamp(52px, 7vw, 68px); background: transparent; color: #A39886; box-shadow: inset 0 0 0 2px #E2D9CA; }
/* The next button is the big, obvious one: a yellow button sized for small fingers. */
.arrow.next { right: clamp(8px, 2vw, 24px); width: clamp(72px, 10vw, 100px); height: clamp(72px, 10vw, 100px); background: var(--gold); color: var(--ink); box-shadow: 0 6px 0 #E3BF62; }
.arrow.next:active { transform: translateY(calc(-50% + 3px)); box-shadow: 0 3px 0 #E3BF62; }
.arrow.next svg { width: 58%; height: 58%; }
.arrow.next.nudge { animation: nudge 1.4s ease-in-out 3; }
@keyframes nudge { 0%, 60%, 100% { translate: 0 0; } 30% { translate: 10px 0; } }
.arrow[disabled] { visibility: hidden; }
.dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
.dots span { width: 9px; height: 9px; border-radius: 50%; background: #E2D9CA; }
.dots span.on { background: #9C8F7E; }
.bubble { position: absolute; z-index: 5; background: #FFFDF7; border-radius: 22px; padding: 4px 22px 0; font-family: var(--font-hanzi); color: var(--ink); font-size: clamp(80px, 14vw, 170px); line-height: 1.12; box-shadow: 0 10px 30px rgba(60,45,20,.22), 0 0 0 3px var(--gold); transform: translate(-50%, -100%); pointer-events: none; animation: rise .25s ease; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 24px; height: 24px; background: #FFFDF7; transform: translateX(-50%) rotate(45deg); box-shadow: 3px 3px 0 0 var(--gold); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, -88%) } }

/* game */
#game, #done { background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(18px, 4vh, 40px); padding: 70px 16px 40px; overflow: hidden; }
.wash { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.progress { position: absolute; top: max(24px, env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
.progress svg { width: clamp(26px, 4vw, 38px); height: auto; }
.progress svg { fill: none; stroke: #CBBFA9; stroke-width: 3; stroke-linejoin: round; }
.progress .got svg { fill: #F2C14E; stroke: #D9A232; }
.big { position: relative; width: clamp(96px, 15vw, 140px); height: clamp(96px, 15vw, 140px); border-radius: 50%; border: 0; background: var(--gold); color: var(--ink); cursor: pointer; display: grid; place-items: center; box-shadow: 0 6px 0 #E3BF62; }
.big svg { width: 50%; height: 50%; }
.big:active { transform: translateY(3px); box-shadow: 0 3px 0 #E3BF62; }
.sentence { position: relative; font-family: var(--font-hanzi); font-size: clamp(40px, min(7vw, 9vh), 84px); line-height: 1.3; display: flex; flex-wrap: wrap; justify-content: center; max-width: 13em; }
.sentence .slot { display: inline-grid; place-items: center; width: 1.1em; height: 1.15em; margin: 0 .06em; border: 3px dashed #CBBFA9; border-radius: 14px; }
.sentence .slot.filled { border-color: var(--leaf); background: #EEF5E2; }
.sentence .reading { background: radial-gradient(closest-side, rgba(243,213,138,.95), rgba(243,213,138,.55) 70%, rgba(243,213,138,0)); border-radius: 12px; }
.cards { position: relative; display: flex; gap: clamp(14px, 3vw, 36px); flex-wrap: wrap; justify-content: center; }
.card { font-family: var(--font-hanzi); font-size: clamp(64px, min(11vw, 14vh), 124px); line-height: 1; color: var(--ink); width: 1.5em; height: 1.5em; display: grid; place-items: center; padding: 0; background: #FFFDF8; border: 0; border-radius: 20px; cursor: pointer; box-shadow: 0 0 0 2px #E4DACB, 0 7px 0 #E4DACB; }
.card .glyph { display: block; line-height: 1; transform: translateY(var(--glyph-shift, 0)); }
.card:nth-child(1) { rotate: -3deg; } .card:nth-child(3) { rotate: 2.5deg; }
.card.right { box-shadow: 0 0 0 5px var(--leaf), 0 7px 0 var(--leaf); background: #EEF5E2; }
.card.wrong { animation: wobble .4s ease; }
@keyframes wobble { 25% { translate: -10px 0 } 75% { translate: 10px 0 } }
.rowbtns { position: relative; display: flex; gap: 28px; }
.star-big { position: relative; width: clamp(160px, 30vw, 280px); height: auto; animation: grow .6s ease; }
@keyframes grow { from { transform: scale(.4) rotate(-20deg); opacity: 0 } }

/* grown-ups */
#parent { background: var(--desk); overflow-y: auto; }
.parent-in { box-sizing: border-box; max-width: 760px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 26px; }
.parent-in h1 { font-size: 26px; font-weight: 600; margin: 0; }
.parent-in h2 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
.parent-in p { margin: 0; color: var(--ink-soft); line-height: 1.55; font-size: 15px; max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-family: var(--font-hanzi); font-size: 30px; line-height: 1; padding: 8px 12px 6px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); display: inline-flex; align-items: baseline; gap: 6px; }
.chip small { font-family: var(--font-ui); font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chip.weak { border-color: var(--seal); }
.chip.learning { border: 2px dashed #D9A232; }
/* A new character he is learning: a soft gold dotted underline says "tap me to hear it". */
.ch.new { text-decoration: underline dotted #D9A232; text-decoration-thickness: 0.07em; text-underline-offset: 0.16em; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--paper); border-radius: 10px; font-size: 15px; }
.list .hz { font-family: var(--font-hanzi); font-size: 24px; }
.pbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 16px; cursor: pointer; font-size: 15px; }
.pbtn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pbtn:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.err { padding: 40px 20px; text-align: center; color: var(--ink-soft); }
@media (max-width: 640px) { .books { grid-template-columns: minmax(0, 1fr); } }
/* A phone (or tablet) held upright: buttons in a bar on top, the whole picture full width,
   big words in the middle, and the next button at the bottom where a thumb reaches it. */
@media (orientation: portrait) {
  .page { display: flex; flex-direction: column; }
  .pic { flex: none; padding-top: calc(max(14px, env(safe-area-inset-top, 0px)) + clamp(48px, 7vw, 66px) + 12px); }
  .pic > svg { height: auto; aspect-ratio: 15 / 8; }
  .band { flex: 1; min-height: 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + clamp(120px, 15vh, 170px)); }
  .line, .line.long { font-size: clamp(36px, 10.5vw, 76px); max-width: 100%; }
  .arrow, .arrow.next:active { top: auto; transform: none; }
  .arrow.prev { left: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); }
  .arrow.next { right: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); width: clamp(80px, 12vw, 110px); height: clamp(80px, 12vw, 110px); }
  .arrow.next:active { translate: 0 3px; }
  .dots { bottom: calc(env(safe-area-inset-bottom, 0px) + 24px + clamp(40px, 6vw, 55px) - 5px); left: 104px; right: 104px; gap: 6px; flex-wrap: wrap; }
  .books .book .t { font-size: clamp(30px, 8vw, 48px); }
}
/* A phone held sideways: little height, so keep the word band compact and give the picture the room. */
@media (orientation: landscape) and (max-height: 500px) {
  .band { min-height: 0; padding-top: 6px; padding-bottom: 22px; }
  .line, .line.long { font-size: clamp(34px, 12vh, 48px); }
  .dots { bottom: 6px; }
  .rbtn { width: 46px; height: 46px; }
  .rbtn.home, .rbtn.speak { top: 10px; }
  .rbtn.home { left: max(10px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .ch.pop, .bubble, .card.wrong, .rbtn.speak.on, .star-big { animation: none } }
</style>

<div id="app">
  <section id="shelf" class="view" aria-label="Bookshelf">
    <div class="shelf-in">
      <div class="shelf-top">
        <button class="grown" id="grown" type="button" aria-label="For grown-ups: press and hold">
          <svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="22"/></svg>

        sayChar(c, function () { praise(cheer, function () { setTimeout(advance, 300); }); });
      }
    } else {
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      praise("again", function () { if (r.type === "listen") sayChar(r.target); });
    }
  }
  function finish() {
    state.done[story.id] = true; save();
    show("done"); praise("done");
  }
  $("again").addEventListener("click", function () { openStory(story); });

  /* ---------- grown-ups (press and hold, so little fingers don't open it by accident) ---------- */
  var holdTimer = 0, grown = $("grown");
  function holdStart(e) { e.preventDefault(); grown.classList.add("holding"); holdTimer = setTimeout(function () { grown.classList.remove("holding"); openParent(); }, 1000); }
  function holdEnd() { clearTimeout(holdTimer); grown.classList.remove("holding"); }
  grown.addEventListener("pointerdown", holdStart);
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { grown.addEventListener(ev, holdEnd); });
  grown.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openParent(); } });
  function openParent() {
    var taps = $("pTaps"); taps.innerHTML = "";
    var keys = Object.keys(state.taps).sort(function (a, b) { return state.taps[b] - state.taps[a]; });
    if (!keys.length) taps.innerHTML = "<p>No taps yet. When he taps a character for help while reading, it shows up here.</p>";
    keys.forEach(function (c) {
      var s = document.createElement("span"); s.className = "chip" + (isLearning(c) ? " learning" : isWeak(c) ? " weak" : ""); s.lang = "zh-CN";
      s.innerHTML = c + "<small>×" + state.taps[c] + "</small>"; taps.appendChild(s);
    });
    var st = $("pStories"); st.innerHTML = "";
    data.stories.forEach(function (s) {
      var d = document.createElement("div");
      d.innerHTML = '<span class="hz" lang="zh-CN">' + s.title + "</span><span>" + (state.done[s.id] ? "Finished, game played" : "Not finished yet") + "</span>";
      st.appendChild(d);
    });
    resetRow(); show("parent");
  }
  function resetRow() {
    var row = $("resetRow"); row.innerHTML = '<button class="pbtn" id="reset" type="button">Clear tap history</button>';
    $("reset").addEventListener("click", function () {
      row.innerHTML = '<span style="font-size:15px">Clear all taps and finished stars?</span><button class="pbtn primary" id="yes" type="button">Clear</button><button class="pbtn" id="no" type="button">Keep</button>';
      $("yes").addEventListener("click", function () { state = { taps: {}, done: {} }; save(); openParent(); });
      $("no").addEventListener("click", resetRow);
    });
  }
  $("parentClose").addEventListener("click", goHome);

  /* ---------- start ---------- */
  /* Always check with the server, so the story list and its audio list never come from different versions. */
  Promise.all([fetch("stories.json", { cache: "no-cache" }).then(function (r) { return r.json(); }), fetch("audio/manifest.json", { cache: "no-cache" }).then(function (r) { return r.json(); })])
    .then(function (res) { data = res[0]; manifest = res[1]; renderShelf(); })
    .catch(function () { $("books").innerHTML = '<p class="err">The books couldn’t load. Check the connection and reopen this page.</p>'; });
})();
</script>
