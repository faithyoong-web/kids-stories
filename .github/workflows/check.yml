name: Check stories

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Cache the font download
        uses: actions/cache@v4
        with:
          path: tools/fonts/LXGWWenKaiGB-Regular.ttf
          key: font-wenkai-gb-v1.530
      - run: pip install -r tools/requirements.txt
      - name: Stories use only learned characters
        run: python tools/check_vocab.py
      - name: Audio matches the stories
        run: python tools/check_audio.py
      - name: Site builds
        run: python tools/build.py
